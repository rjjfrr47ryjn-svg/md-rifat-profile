<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>রিফাত | ডিজিটাল প্রোফাইল</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #080c14;
            --card-bg: rgba(255, 255, 255, 0.04);
            --accent-color: #00f2ea;
            --secondary-accent: #ff0050;
            --text-color-primary: #ffffff;
            --text-color-secondary: #b0bec5;
            --font-main: 'Noto Sans Bengali', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-main);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }

        /* ব্যাকগ্রাউন্ড লাইটিং ইফেক্ট */
        body::before {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            background: var(--accent-color);
            filter: blur(160px);
            opacity: 0.12;
            top: 5%;
            left: 10%;
            z-index: -1;
        }
        body::after {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            background: var(--secondary-accent);
            filter: blur(160px);
            opacity: 0.1;
            bottom: 5%;
            right: 10%;
            z-index: -1;
        }

        .profile-container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
        }

        .profile-pic-wrapper {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 20px;
        }

        .profile-pic-wrapper img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--bg-color);
            box-shadow: 0 0 20px rgba(0, 242, 234, 0.4);
        }

        .profile-pic-wrapper::after {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            background: linear-gradient(45deg, var(--accent-color), var(--secondary-accent));
            border-radius: 50%;
            z-index: -1;
            filter: blur(8px);
            opacity: 0.8;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #ffffff, var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 242, 234, 0.08);
            color: var(--accent-color);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 242, 234, 0.2);
        }

        .status-dot {
            height: 8px;
            width: 8px;
            background-color: var(--accent-color);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-color);
        }

        .bio {
            font-size: 0.95rem;
            color: var(--text-color-secondary);
            margin-bottom: 30px;
            line-height: 1.5;
            padding: 0 10px;
        }

        /* দুটি করে পাশাপাশি অপশন সাজানোর জন্য গ্রিড লেআউট */
        .links-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .link-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 20px 15px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-color-primary);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.07);
        }

        .link-card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.07);
            border-color: var(--accent-color);
            box-shadow: 0 5px 20px rgba(0, 242, 234, 0.2);
        }

        .link-card i {
            font-size: 1.8rem;
        }

        /* নির্দিষ্ট আইকনের রঙ */
        .fa-tiktok { color: #ff0050; }
        .fa-facebook { color: #1877f2; }
        .fa-whatsapp { color: #25d366; }
        .fa-phone-alt { color: var(--accent-color); }

        /* মোবাইল স্ক্রিনের জন্য রেসপনসিভ */
        @media (max-width: 480px) {
            .links-grid {
                grid-template-columns: 1fr; /* মোবাইল স্ক্রিন ছোট হলে ১ কলামেও হতে পারে, চাইলে 1fr রাখতে পারেন অথবা 2fr রাখলে পাশাপাশি থাকবে */
            }
        }
    </style>
</head>
<body>

    <div class="profile-container">
        <!-- প্রোফাইল পিকচার -->
        <div class="profile-pic-wrapper">
            <img src="rifat-pic.jpg" alt="রিফাত">
        </div>

        <h1>রিফাত হোসেন</h1>
        
        <div class="status">
            <span class="status-dot"></span>
            <span>সক্রিয় আছেন</span>
        </div>

        <p class="bio">
            আসসালামু আলাইকুম! আমি রিফাত হোসেন। প্রযুক্তির সাথে পথচলা এবং নতুন কিছু শেখার প্রবল আগ্রহ রয়েছে। আমার সাথে যোগাযোগের মাধ্যমগুলো নিচে দেওয়া হলো।
        </p>

        <!-- দুইটা দুইটা করে সাজানো অপশন বা বাটনগুলো -->
        <div class="links-grid">
            <!-- টিকটক -->
            <a href="https://tiktok.com/@rifatr887" class="link-card" target="_blank">
                <i class="fab fa-tiktok"></i>
                <span>টিকটক</span>
            </a>

            <!-- ফেসবুক -->
            <a href="https://www.facebook.com" class="link-card" target="_blank">
                <i class="fab fa-facebook"></i>
                <span>ফেসবুক</span>
            </a>
            
            <!-- হোয়াটসঅ্যাপ -->
            <a href="https://wa.me/8801953729545" class="link-card">
                <i class="fab fa-whatsapp"></i>
                <span>হোয়াটসঅ্যাপ</span>
            </a>

            <!-- সরাসরি কল -->
            <a href="tel:01953729545" class="link-card">
                <i class="fas fa-phone-alt"></i>
                <span>কল করুন</span>
            </a>
        </div>
    </div>

</body>
</html>
